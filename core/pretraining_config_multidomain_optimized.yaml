# ===================================================================
# MIND Project - Multi-Domain Pretraining Configuration (OPTIMIZED)
# ===================================================================
# Optimized Multi-Domain Pretraining with:
# ⚡ 1. OpenAI Triton Block-Sparse & Varlen FlashAttention (Padding-Free)
# ⚡ 2. Vectorized Geometric Feature Extraction & COM Centering
# ⚡ 3. GPU-Level Vectorized MLM Masking
# ⚡ 4. GPU-Level Vectorized Edge/Pair Distance Masking
# ⚡ 5. Hardware BFloat16 Loss Head Autocast & AMP Mixed Precision
#
# Usage:
#   CUDA_VISIBLE_DEVICES=0 PYTHONPATH=. python core/train_pretrain.py --config-yaml-path core/pretraining_config_multidomain_optimized.yaml
# ===================================================================

# -------------------------
# Genel ve Çıktı Ayarları
# -------------------------
seed: 42
out_path: "outputs/multidomain_pretrain_optimized"
wandb_project_name: "MIND-Project-Pretraining"
wandb_run_name: "multidomain_triton_optimized"

# -------------------------
# Multi-Domain Configuration
# -------------------------
multi_domain:
  enabled: true  # ✅ Multi-domain cross-modal training enabled
  
  # Dataset Configurations
  datasets:
    pdb:
      enabled: true
      chunk_dir: "/home/yusuf/data/proteins/processed_14atom"  # 14-atom uniform representation chunks (10 chunks)
      atom_ratio: 10
      chunk_range: [0, 2]  # Chunks 0..2
    
    rna:
      enabled: true
      chunk_dir: "/home/yusuf/data/rna/processed_23slot"      # 23-slot RNA chunks (67 chunks)
      atom_ratio: 5
      chunk_range: [0, 2]

    qm9:
      enabled: false
      chunk_dir: "/home/arin/data/qm9_chunks"
      atom_ratio: 5
      chunk_range: null

    metabolite:
      enabled: false  # Unmounted external drive
      chunk_dir: "/media/ubuntu/8TB/ege/processed"
      atom_ratio: 10
      chunk_range: null

    unimol:
      enabled: false
      chunk_dir: "/home/arin/8TB_arin/unimol_pyg_full/universal_unimol"
      atom_ratio: 25
      chunk_range: null

    dna:
      enabled: false
      chunk_dir: "../data/dna/processed_chunks"
      atom_ratio: 0
  
  max_cache_chunks: 20              # Maximum chunks in LRU cache
  fallback_to_single_domain: true   # Fallback if metadata missing

# -------------------------
# Single-Domain Fallback Settings
# -------------------------
dataset: PDB
universal_cache_path: "data_loading/cache/universal_pdb_all.pkl"
dataset_download_dir: "/home/yusuf/data/proteins"

# -------------------------
# Data Loading Settings
# -------------------------
num_workers: 2  # Multi-threaded dynamic chunk batching
max_samples: null
use_universal_cache: true

# -------------------------
# ⚡ Optimizasyon Bayrakları (Optimization Suite)
# -------------------------
# Opt 1: Vectorized geometric feature extraction & COM centering
use_vectorized_geometric_features: true

# Opt 2: GPU-level vectorized MLM masking
use_vectorized_mlm_masking: true

# Opt 3: GPU-level vectorized edge pair masking (long/short range distance)
use_vectorized_edge_masking: true

# Opt 4: OpenAI Triton Block-Sparse & Varlen FlashAttention
use_triton_flash_attention: true
use_triton_varlen_flash_attention: true
xformers_or_torch_attn: triton

# Opt 5: Hardware BFloat16 Loss Head Autocast
use_bfloat16_loss_head: true

# -------------------------
# Eğitim Parametreleri
# -------------------------
max_epochs: 100
batch_size: 4  # Validation batch size
use_dynamic_batching: true  # ⚡ Atom-aware dynamic batching
use_improved_sampler: true
max_atoms_per_batch: 8000   # ⚡ Optimized for 32GB RTX 5000 Ada with Triton Varlen
log_batch_statistics: true
batch_stats_log_frequency: 100

# Per-Type Loss Tracking
compute_per_type_losses: true   # Track losses per dataset type (protein, rna, etc.)
log_per_type_frequency: 20

lr: 0.0005
early_stopping_patience: 25
gradient_clip_val: 0.5
optimiser_weight_decay: 1.0e-10
monitor_loss_name: "val_total_loss"
use_bfloat16: true
accelerator: gpu #! Not used
devices: 1  # Use single GPU (will be GPU 6 via CUDA_VISIBLE_DEVICES) #! Not used
precision: bfloat16
num_sanity_val_steps: 0
# Validation and logging: run validation and log to wandb more often than once per epoch
val_check_interval: 0.20  # Fraction of epoch (0.25 = 4x per epoch). Use int for "every N steps"
log_every_n_steps: 20       # Log train metrics to wandb every N steps
fast_dev_run: false #! Not used

# -------------------------
# Model Mimarisi (ESA Backbone)
# -------------------------
apply_attention_on: node
graph_dim: 256
edge_dim: 64
hidden_dims: [256, 256, 256, 256, 256, 256, 256, 256]
num_heads: [16, 16, 16, 16, 16, 16, 16, 16]
layer_types: ["M", "S", "M", "S", "M", "S", "P", "P"]
norm_type: LN
use_3d_coordinates: true
set_max_items: 0
triu_attn_mask: false

# -------------------------
# Equivariant Features (Disabled for Maximum Pretraining Throughput)
# -------------------------
use_equivariant_features: false
equivariant_lmax: 2
equivariant_num_features: 16
equivariant_fusion_method: add
equivariant_cross_connection: true

# -------------------------
# MLP Ayarları
# -------------------------
use_mlps: true
mlp_hidden_size: 512
num_mlp_layers: 3
mlp_type: standard
mlp_dropout: 0.0
use_mlp_ln: false
pre_or_post: pre

# -------------------------
# Dropout Ayarları
# -------------------------
sab_dropout: 0.0
mab_dropout: 0.0
pma_dropout: 0.0
attn_residual_dropout: 0.0
pma_residual_dropout: 0.0

# -------------------------
# 3D Geometrik Parametreler
# -------------------------
molecule_max_atoms: null
gaussian_kernels: 128
cutoff_distance: 5.0
max_neighbors: 64

# Long-range distance loss
max_distance: 20.0
distance_bins: 16
distance_bin_boundaries: [1.0, 1.5, 2.0, 2.5, 3.0, 3.5, 4.0, 5.0, 7.0, 9.0, 11.0, 13.0, 15.5, 17.5, 20.0]

# Short-range distance loss
short_range_max_distance: 5.0
short_range_distance_bins: 10
short_range_bin_boundaries: [0.8, 1.2, 1.5, 2.0, 2.5, 3.0, 3.5, 4.0, 4.5]

# -------------------------
# Hybrid Edge Construction
# -------------------------
use_hybrid_edges: true
sequence_neighbors_k: 3
max_spatial_neighbors: 48
num_random_edges: 8
random_edge_min_distance: 10.0

# -------------------------
# Dynamic Random Edges
# -------------------------
use_dynamic_random_edges: true
replace_existing_random_edges: true

# -------------------------
# Ön-Eğitim Görevleri
# -------------------------
pretraining_tasks: ["long_range_distance", "short_range_distance", "mlm"]
task_weights:
  long_range_distance: 1.5
  short_range_distance: 1.0
  mlm: 0.3
mlm_mask_ratio: 0.15
coconut_masking_method: random_walk
coconut_mask_ratio: 0.15
coconut_num_random_walks: 1
log_coconut_masking_stats: true
log_coconut_masking_frequency: 50

protein_block_mlm: true
protein_block_mlm_ratio: 0.15
temperature: 0.2
