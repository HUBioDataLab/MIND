# ===================================================================
# MIND - protein-only pretraining, matched to the four-domain 1M run
# ===================================================================
# Everything (model, tasks, masking, LR schedule, 18k atoms per batch, 6,400 batches
# per epoch, splits) comes from base_config; only the other domains are switched off.
# Compare with the four-domain run at the same epoch: both use the same per-epoch
# LR schedule and step count. Check the epoch plan before a long run:
#   make check-epoch-plan CONFIG=pretraining_config_protein_only
# Usage: make train GPU=<id> CONFIG=pretraining_config_protein_only EPOCHS=500 SEED=42 LOG=protein_only_1m_500ep
# ===================================================================

base_config: pretraining_config_multidomain_1m_coconut.yaml
wandb_run_name: "protein-only-1m-v1"

multi_domain:
  datasets:
    rna: {enabled: false}
    unimol: {enabled: false}
    metabolite: {enabled: false}
  atom_sampling:
    epoch_atom_budget: 96000000      # natural plan at 18k atoms must stay below 6,400 batches (see check-epoch-plan)
    domain_weights: {protein: 1}
