# ===================================================================
# MIND - Fast sanity check config (3 domains, 40k protein baseline)
# ===================================================================
# Standalone copy of pretraining_config_multidomain.yaml with small budgets; keep the two in sync.
# Usage: make train GPU=6 CONFIG=f LOG=fast_test
# ===================================================================

seed: 42
wandb_project_name: "MIND-Project-Pretraining"
wandb_run_name: "fast-sanity-check"
use_wandb: true

multi_domain:
  enabled: true
  datasets:
    pdb:
      enabled: true
      chunk_dir: "${MIND_DATA_ROOT}/proteins/processed_14atom_edgefree"  # edge-free 40k protein chunks
      chunk_range: [0, 0]
      max_graph_atoms: 12000
    metabolite:
      enabled: false  # off in the fast 3-domain check; the four-domain check is pretraining_config_fast_1m_coconut.yaml
      chunk_dir: "${MIND_DATA_ROOT}/metabolites/processed"
      chunk_range: [0, 0]
    unimol:
      enabled: true
      chunk_dir: "${MIND_DATA_ROOT}/small_molecules/unimol/universal_unimol"
      chunk_range: [0, 0]
      max_graph_atoms: 12000
    rna:
      enabled: true
      chunk_dir: "${MIND_DATA_ROOT}/rna_small/processed_23slot_5k_edgefree"  # edge-free copy of the development RNA
      chunk_range: [0, 0]
      max_graph_atoms: 5000
  atom_sampling:
    enabled: true
    epoch_atom_budget: 700000
    epoch_num_batches: 140
    cycle_to_quota: true
    domain_weights:
      protein: 30
      rna: 25
      unimol: 45
  max_cache_chunks: 4

dataset: PDB
universal_cache_path: "data_loading/cache/universal_pdb_all.pkl"
dataset_download_dir: "${MIND_DATA_ROOT}/proteins/processed_14atom_edgefree"  # single-domain loader only; unused while multi_domain.enabled is true

num_workers: 0
max_samples: null

max_epochs: 3
batch_size: 32
use_dynamic_batching: true
use_improved_sampler: true
max_atoms_per_batch: 6000  # same budget as the 40k multidomain baseline
log_batch_statistics: true
batch_stats_log_frequency: 25  # Compact telemetry/table cadence; every batch is retained in epoch stats.

compute_per_type_losses: true
log_per_type_frequency: 10

lr: 0.0005
early_stopping_patience: 15
gradient_clip_val: 0.5
optimiser_weight_decay: 1.0e-10
monitor_loss_name: "val_total_loss"
use_bfloat16: true
devices: 1
num_sanity_val_steps: 0
val_check_interval: 0.5
log_every_n_steps: 25

apply_attention_on: node
graph_dim: 256
hidden_dims: [256, 256, 256, 256, 256, 256, 256]
num_heads: [16, 16, 16, 16, 16, 16, 16]
layer_types: ["M", "S", "M", "S", "M", "S", "P"]
norm_type: LN
use_3d_coordinates: true
set_max_items: 0

use_equivariant_features: false

use_mlps: true
mlp_hidden_size: 512
num_mlp_layers: 3
mlp_type: standard
mlp_dropout: 0.0
use_mlp_ln: false
pre_or_post: pre

sab_dropout: 0.0
mab_dropout: 0.0
pma_dropout: 0.0
attn_residual_dropout: 0.0
pma_residual_dropout: 0.0

molecule_max_atoms: null
gaussian_kernels: 128
cutoff_distance: 5.0
max_neighbors: 64
max_distance: 20.0
distance_bins: 16
distance_bin_boundaries: [1.0, 1.5, 2.0, 2.5, 3.0, 3.5, 4.0, 5.0, 7.0, 9.0, 11.0, 13.0, 15.5, 17.5, 20.0]
short_range_max_distance: 5.0
short_range_distance_bins: 10
short_range_bin_boundaries: [0.8, 1.2, 1.5, 2.0, 2.5, 3.0, 3.5, 4.0, 4.5]

sequence_neighbors_k: 3
max_spatial_neighbors: 48
num_random_edges: 8
random_edge_min_distance: 10.0

use_dynamic_random_edges: true
replace_existing_random_edges: true

pretraining_tasks: ["long_range_distance", "short_range_distance", "mlm"]
task_weights:
  long_range_distance: 1.0
  short_range_distance: 1.0
  mlm: 1.0
mlm_mask_ratio: 0.15

# Block MLM: protein masks whole residues, RNA whole nucleotides; UniMol and COCONUT stay atom-level.
protein_block_mlm: true
protein_block_mlm_ratio: 0.15
rna_block_mlm: true
rna_block_mlm_ratio: 0.15
use_domain_local_slot_embedding: true
virtual_atom_loss_weight: 0.2
protein_block_mlm_exclude_legacy_oxt: true

geometry_neutral_virtual_slots:
  enabled: true
  protein: true
  rna: true
  context_audit_batches: 4
  gradient_audit_batches: 1

