# ===================================================================
# MIND - Fast check with all four domains: 1M protein, full RNA, UniMol, COCONUT
# ===================================================================
# Same as pretraining_config_fast_1m.yaml plus COCONUT (chunks 0-1 in name order,
# random 80/10/10 split). COCONUT batches carry explicit bonds, which currently
# zero the chemical-coordination features of every other graph in the batch
# (documented encoder defect), so this checks the data path, not model quality.
# Usage: make train GPU=<id> CONFIG=pretraining_config_fast_1m_coconut EPOCHS=3 LOG=fast_1m_coconut
# ===================================================================

seed: 42
out_path: "outputs/fast_1m_coconut"
wandb_project_name: "MIND-Project-Pretraining"
wandb_run_name: "fast-1m-coconut"
use_wandb: true

multi_domain:
  enabled: true
  # Edge-free 1M protein and full RNA built from raw by data_loading/build_edge_free_chunks.py.
  # Their train/val/test chunks are fixed by structure ID (protein) or PDB entry (RNA);
  # 'splits' selects chunks per split. Domains without 'splits' are random-split 80/10/10.
  # chunk_range indexes the name-sorted chunk directories, inclusive; null = all.
  datasets:
    pdb:
      enabled: true
      max_graph_atoms: 14336      # 1,024 residues x 14 slots
      oversized_graphs: skip      # 25 raw files exceed 1,024 residues; logged and excluded
      splits:
        train: {chunk_dir: "/home/yusuf/data/proteins/processed_14atom_1m_edgefree_train", chunk_range: [0, 0]}
        val: {chunk_dir: "/home/yusuf/data/proteins/processed_14atom_1m_edgefree_val", chunk_range: [0, 0]}
        test: {chunk_dir: "/home/yusuf/data/proteins/processed_14atom_1m_edgefree_test", chunk_range: [0, 0]}
    rna:
      enabled: true
      max_graph_atoms: 6000       # full corpus has graphs up to 102k atoms; no windowing yet
      oversized_graphs: skip
      splits:
        train: {chunk_dir: "/home/yusuf/data/rna/processed_23slot_full_edgefree_train", chunk_range: [0, 1]}
        val: {chunk_dir: "/home/yusuf/data/rna/processed_23slot_full_edgefree_val", chunk_range: [0, 0]}
        test: {chunk_dir: "/home/yusuf/data/rna/processed_23slot_full_edgefree_test", chunk_range: [0, 0]}
    unimol:
      enabled: true
      chunk_dir: "/home/yusuf/data/small_molecules/unimol/universal_unimol"
      chunk_range: [0, 0]
      max_graph_atoms: 12000
    metabolite:
      enabled: true
      chunk_dir: "/home/yusuf/data/metabolites/processed"   # 497 sibling processed_chunk_* directories
      chunk_range: [0, 1]
    qm9:
      enabled: false
      chunk_dir: "/home/arin/data/qm9_chunks"
      chunk_range: null
    dna:
      enabled: false
      chunk_dir: "../data/dna/processed_chunks"
  # Budgeted virtual epochs: a fixed atom budget split by domain weights and a fixed
  # batch count (constant plan length, so Lightning consumes every planned batch).
  atom_sampling:
    enabled: true
    epoch_atom_budget: 2400000
    epoch_num_batches: 160
    cycle_to_quota: true
    domain_weights:        # keys are metadata dataset types (COCONUT = coconut)
      protein: 55
      rna: 15
      unimol: 20
      coconut: 10
  max_cache_chunks: 6
  fallback_to_single_domain: true

dataset: PDB
universal_cache_path: "data_loading/cache/universal_pdb_all.pkl"
dataset_download_dir: "/home/yusuf/data/proteins/processed_14atom"

num_workers: 0
max_samples: null
use_universal_cache: true

max_epochs: 3
batch_size: 32
use_dynamic_batching: true
use_improved_sampler: true
max_atoms_per_batch: 18000  # same budget as the full 1M run
log_batch_statistics: true
batch_stats_log_frequency: 25  # Compact telemetry/table cadence; every batch is retained in epoch stats.

compute_per_type_losses: true
log_per_type_frequency: 10

lr: 0.0005
early_stopping_patience: 15
gradient_clip_val: 0.5
optimiser_weight_decay: 1.0e-10
monitor_loss_name: "val_total_loss"
use_bfloat16: true
accelerator: gpu
devices: 1
precision: bfloat16
num_sanity_val_steps: 0
val_check_interval: 1.0  # one validation per epoch: the protein val chunk alone is ~800 batches
log_every_n_steps: 25
fast_dev_run: false

apply_attention_on: node
graph_dim: 256
edge_dim: 64
hidden_dims: [256, 256, 256, 256, 256, 256, 256]
num_heads: [16, 16, 16, 16, 16, 16, 16]
layer_types: ["M", "S", "M", "S", "M", "S", "P"]
xformers_or_torch_attn: flash_varlen
norm_type: LN
use_3d_coordinates: true
set_max_items: 0
triu_attn_mask: false

use_equivariant_features: false
equivariant_lmax: 2
equivariant_num_features: 16
equivariant_fusion_method: add
equivariant_cross_connection: true

use_mlps: true
mlp_hidden_size: 512
num_mlp_layers: 3
mlp_type: standard
mlp_dropout: 0.0
use_mlp_ln: false
pre_or_post: pre

sab_dropout: 0.0
mab_dropout: 0.0
pma_dropout: 0.0
attn_residual_dropout: 0.0
pma_residual_dropout: 0.0

molecule_max_atoms: null
gaussian_kernels: 128
cutoff_distance: 5.0
max_neighbors: 64
max_distance: 20.0
distance_bins: 16
distance_bin_boundaries: [1.0, 1.5, 2.0, 2.5, 3.0, 3.5, 4.0, 5.0, 7.0, 9.0, 11.0, 13.0, 15.5, 17.5, 20.0]
short_range_max_distance: 5.0
short_range_distance_bins: 10
short_range_bin_boundaries: [0.8, 1.2, 1.5, 2.0, 2.5, 3.0, 3.5, 4.0, 4.5]

use_hybrid_edges: true
sequence_neighbors_k: 3
max_spatial_neighbors: 48
num_random_edges: 8
random_edge_min_distance: 10.0

use_dynamic_random_edges: true
replace_existing_random_edges: true

# COCONUT masking settings, as in pretraining_config_multidomain.yaml.
coconut_masking_method: random_walk  # random_atom | random_walk
coconut_mask_ratio: 0.15
coconut_num_random_walks: 1
log_coconut_masking_stats: true
log_coconut_masking_frequency: 50

pretraining_tasks: ["long_range_distance", "short_range_distance", "mlm"]
task_weights:
  long_range_distance: 1.0
  short_range_distance: 1.0
  mlm: 1.0
mlm_mask_ratio: 0.15

# Protein-only block MLM (see multidomain config for details).
protein_block_mlm: true
protein_block_mlm_ratio: 0.15
rna_block_mlm: true
rna_block_mlm_ratio: 0.15
use_domain_local_slot_embedding: true
virtual_atom_loss_weight: 0.2
protein_block_mlm_exclude_legacy_oxt: true

# Deprecated synthetic-coordinate experiment. It is kept off; the
# geometry-neutral view below replaces it.
masked_slot_template:
  enabled: false
  protein: false
  rna: false
  visible_virtuals_prepositioned: false

geometry_neutral_virtual_slots:
  enabled: true
  protein: true
  rna: true
  context_audit_batches: 4
  gradient_audit_batches: 1

temperature: 0.2

max_block_types: 150
max_position_types: 15
max_entity_types: 6
block_embedding_dim: 32
position_embedding_dim: 16
entity_embedding_dim: 8
use_hierarchical_features: false
max_atomic_num: 118
rwse_dim: 24
lap_dim: 4
mlp_inter_dim: 128
pma_num_outputs: 32
