# MoleculeNet (QM9 excluded): 14 downstream tasks from the Uni-Mol LMDB release, one task family (GO-style),
# one processed directory per task under <source_root>/<task>/processed/<revision>.
#
# Source: molecular_property_prediction.tar.gz of the Uni-Mol repository (DP Technology), linked from the
# github.com/deepmodeling/Uni-Mol README (`archive` below). `download` fetches it into <source_root>/raw (an archive
# already there is checked, never fetched again), checks its size, md5 and sha256 and extracts it to
# <source_root>/raw/extracted/molecular_property_prediction/<dataset>/{train,valid,test}.lmdb; every run is recorded in
# <source_root>/provenance.json. No licence text ships with the data: local use only, no redistribution. The pickles
# come from a third party and are read with a restricted unpickler (numpy arrays only).
#
# Processing rules:
#   split          Uni-Mol scaffold split as shipped in the LMDB files (train / valid / test); primary.
#   conformer      the FIRST conformer (index 0) of the 11 stored per molecule. The last one (index 10) is the flat
#                  fallback of Uni-Mol and is never used. Molecules whose 11 conformers are all flat (z = 0, RDKit
#                  failed) are flagged and counted, not dropped; metrics use every molecule, flagged subsets are
#                  reported in addition.
#   hydrogens      dropped (Uni-Mol --only-polar 0 and our pretraining data have no H). Counts are in the QC report.
#   atom count     NO cropping (Uni-Mol crops at 256 atoms; we do not). Molecules above 256 heavy atoms are counted.
#   rare elements  an element outside the whitelist of data_loading.cache_to_pyg maps to id 119 at graph-build time.
#                  Such molecules are kept, flagged and counted per element.
#   empty/single   a molecule left with 0 heavy atoms (ion/salt/H-only) is kept in the processed file, flagged
#                  `no_heavy_atoms` and counted; it cannot be embedded (the graph needs one atom) and any attempt
#                  raises, so the embed step must decide on it explicitly. One heavy atom is flagged
#                  `single_heavy_atom`; its graph has no edge. No molecule of the 14 data sets of this release
#                  has 0 heavy atoms.
#   labels         the LMDB codes a missing classification label as -1; stored as NaN plus a boolean mask.
#   coordinates    stored in Angstrom. Every dataset declares the unit of its LMDB coordinates (`coordinate_unit`, no
#                  default); processing multiplies by the factor of that unit (bohr 0.529177210903, CODATA 2018). The
#                  QM7 release stores Bohr (median nearest-neighbour distance 2.64 against 1.37-1.46 for the other
#                  13 sets; the heavy-atom skeleton of 1923 of 1963 molecules equals the SMILES graph after the
#                  conversion, 1 before it). After conversion the median over molecules of the per-molecule median
#                  nearest-neighbour distance of each split must lie in `plausible_median_nn_angstrom`, else
#                  processing stops naming the task.

family: molnet
modality: small_molecule
# Default revision of the processed directory; a dataset entry may override it. QM7 is v2 (Bohr coordinates converted
# to Angstrom); a v1 QM7 directory holds unconverted coordinates and is refused at load time.
processed_revision: v1
plausible_median_nn_angstrom: [1.0, 2.0]
source_name: unimol_molnet
source_root: ${MIND_DATA_ROOT}/downstream/unimol_molnet      # task data_root = <source_root>/<task>
raw_subdir: raw/extracted/molecular_property_prediction

# The release archive (about 3.5 GiB). `download` places it at <source_root>/raw/<name> and extracts it to
# <source_root>/<extract_subdir>; the archive's top folder must then be <source_root>/<raw_subdir>.
archive:
  url: https://bioos-hermite-beijing.tos-cn-beijing.volces.com/unimol_data/finetune/molecular_property_prediction.tar.gz
  name: molecular_property_prediction.tar.gz
  bytes: 3764044131
  md5: 007286c6367984876cfd05475d2489ac        # equals the md5 the server reports for the object
  sha256: a59d465eb82d9498e2696a23b687a5e53d4b8545a8437816c9f7bc537ade8246
  extract_subdir: raw/extracted

splits: [train, valid, test]
conformer: {policy: first, expected_per_molecule: 11}
hydrogens: drop
max_atoms_policy: none
report_atom_threshold: 256        # only a counter in the QC report, never a filter

# Label coding of the LMDB: classification targets are {-1 missing, 0, 1}; regression targets are real values
# (a NaN marks a missing value there; -1 is a real value).
missing_classification_code: -1

embedding:
  seed: 0
  poolings: [mean_atoms]           # `ca` and `mean_residues` need protein template metadata
  max_atoms_per_batch: 30000

probe:
  pooling: mean_atoms
  seeds: [0, 1, 2]
  epochs: 300
  patience: 30
  batch_size: 256
  lr: 0.001
  weight_decay: 0.0001
  mlp_hidden: 512
  mlp_dropout: 0.2

# Fine-tuning of these kinds is not implemented (downstream.finetune refuses them); the block is kept so a later
# implementation reads the same keys as the other tasks.
finetune:
  pooling: mean_atoms
  head: mlp
  seeds: [0]
  epochs: 50
  patience: 10
  max_atoms_per_batch: 15000
  lr_encoder: 0.00001
  lr_head: 0.001
  weight_decay: 0.0001
  mlp_hidden: 512
  mlp_dropout: 0.2

# Counts are the entries of the LMDB files of this release; processing fails on any difference.
# Classification: ROC-AUC (primary, Uni-Mol protocol) and PRC-AUC, mean over targets, per-target masking of missing
# labels; targets with one class in a split are skipped and counted. Regression: RMSE and MAE averaged over targets;
# the primary (early stopping) metric is the one Uni-Mol reports: RMSE for ESOL/FreeSolv/Lipophilicity, MAE for QM7/QM8.
datasets:
  bbbp: {coordinate_unit: angstrom, task: mn_bbbp, kind: multilabel_masked, num_targets: 1, metrics: [roc_auc, prc_auc], primary_metric: roc_auc, expected_counts: {train: 1631, valid: 204, test: 204}}
  bace: {coordinate_unit: angstrom, task: mn_bace, kind: multilabel_masked, num_targets: 1, metrics: [roc_auc, prc_auc], primary_metric: roc_auc, expected_counts: {train: 1210, valid: 151, test: 152}}
  clintox: {coordinate_unit: angstrom, task: mn_clintox, kind: multilabel_masked, num_targets: 2, metrics: [roc_auc, prc_auc], primary_metric: roc_auc, expected_counts: {train: 1182, valid: 148, test: 148}}
  tox21: {coordinate_unit: angstrom, task: mn_tox21, kind: multilabel_masked, num_targets: 12, metrics: [roc_auc, prc_auc], primary_metric: roc_auc, expected_counts: {train: 6264, valid: 783, test: 784}}
  toxcast: {coordinate_unit: angstrom, task: mn_toxcast, kind: multilabel_masked, num_targets: 617, metrics: [roc_auc, prc_auc], primary_metric: roc_auc, expected_counts: {train: 6860, valid: 858, test: 858}}
  sider: {coordinate_unit: angstrom, task: mn_sider, kind: multilabel_masked, num_targets: 27, metrics: [roc_auc, prc_auc], primary_metric: roc_auc, expected_counts: {train: 1141, valid: 143, test: 143}}
  hiv: {coordinate_unit: angstrom, task: mn_hiv, kind: multilabel_masked, num_targets: 1, metrics: [roc_auc, prc_auc], primary_metric: roc_auc, expected_counts: {train: 32901, valid: 4113, test: 4113}}
  pcba: {coordinate_unit: angstrom, task: mn_pcba, kind: multilabel_masked, num_targets: 128, metrics: [roc_auc, prc_auc], primary_metric: roc_auc, expected_counts: {train: 350343, valid: 43793, test: 43793}}
  muv: {coordinate_unit: angstrom, task: mn_muv, kind: multilabel_masked, num_targets: 17, metrics: [roc_auc, prc_auc], primary_metric: roc_auc, expected_counts: {train: 74469, valid: 9309, test: 9309}}
  esol: {coordinate_unit: angstrom, task: mn_esol, kind: multitarget_regression, num_targets: 1, metrics: [rmse, mae], primary_metric: rmse, expected_counts: {train: 902, valid: 113, test: 113}}
  freesolv: {coordinate_unit: angstrom, task: mn_freesolv, kind: multitarget_regression, num_targets: 1, metrics: [rmse, mae], primary_metric: rmse, expected_counts: {train: 513, valid: 64, test: 65}}
  lipo: {coordinate_unit: angstrom, task: mn_lipo, kind: multitarget_regression, num_targets: 1, metrics: [rmse, mae], primary_metric: rmse, expected_counts: {train: 3360, valid: 420, test: 420}}
  qm7dft: {processed_revision: v2, coordinate_unit: bohr, task: mn_qm7, kind: multitarget_regression, num_targets: 1, metrics: [rmse, mae], primary_metric: mae, expected_counts: {train: 5464, valid: 685, test: 681}}
  qm8dft: {coordinate_unit: angstrom, task: mn_qm8, kind: multitarget_regression, num_targets: 12, metrics: [rmse, mae], primary_metric: mae, expected_counts: {train: 17428, valid: 2179, test: 2179}}
