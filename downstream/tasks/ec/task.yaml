# Enzyme Commission number prediction (DeepFRI nrPDB-EC 2020.04 split, as used by GearNet).
# 538 EC terms, multi-label; train/valid/test = 15,550 / 1,729 / 1,919 PDB chains.
# Test subsets: chains below 30/40/50/70/95 % max sequence identity to train
# (column "<X%" == 1 in the cutoff CSV; 95 % is the full test set, the headline number).

task: ec
modality: protein
# Suffix of the processed directory name. v2 reads 2- and 3-character PDB chain ids (4V7G-AA, 4UE3-SSS);
# v3 keeps the sequence gap of residues dropped for a missing backbone atom in block_idx (schema
# source.block_index). ds-embed/ds-probe read the directory of this revision.
processed_revision: v3
data_root: ${MIND_DATA_ROOT}/downstream/ec/protein   # raw/, processed/, splits/, provenance.json
# Disk (GiB, measured with du on a completed build): extracted = the extracted tree, processed = one processed directory.
# `make ds-prepare` uses them for its disk estimate only; archive sizes come from the pins.
disk_estimate_gib: {extracted: 5.0, processed: 5.2}

# deepfri_rcsb: DeepFRI metadata (pinned commit, sha256 checked) + RCSB mmCIF per PDB entry.
# torchdrug_zip: the per-chain PDB files packaged by TorchDrug/GearNet (Zenodo, md5 checked).
source: torchdrug_zip   # the exact chain files GearNet and the literature numbers used
sources:
  deepfri_rcsb:
    commit: 6caa96e086091152e74be5924be1fcde11ce2413
    base_url: https://raw.githubusercontent.com/flatironinstitute/DeepFRI/{commit}/preprocessing/data
    files:   # sha256 verified against the pinned commit on 2026-10-19
      annot: {name: nrPDB-EC_2020.04_annot.tsv, sha256: 79e429e2efe9f8a9ad973ddb27c1ba1425f2b6aa1989fb01fe10f65a84899ed1}
      train: {name: nrPDB-EC_2020.04_train.txt, sha256: 5b674928876400203c6eb1e96250b951676024f17b2cfecf48de4f822a2606db}
      valid: {name: nrPDB-EC_2020.04_valid.txt, sha256: 2630c4d46fc35965979b57bfc1476f5cc3da17ac227c8beca9e12a3d1caf6fc2}
      test: {name: nrPDB-EC_2020.04_test.txt, sha256: e1cfd23416673a9f594ee4c1f01c03f463baeb52ea1310f7d4b87868a28ccafe}
      test_cutoffs: {name: nrPDB-EC_2020.04_test.csv, sha256: 3cbaef7f4c022519c2f57d021ee84b6d2c342459525aec25ed056a7c2b9ad209}
    structure_url: https://files.rcsb.org/download/{pdb_id}.cif.gz
    download_workers: 8
  torchdrug_zip:
    url: https://zenodo.org/records/6622158/files/EnzymeCommission.zip
    md5: 33f799065f8ad75f87b709a87293bc65
    bytes: 1034145814

splits: [train, valid, test]
label_count: 538
test_cutoffs: [30, 40, 50, 70, 95]
# Known gap of the DeepFRI cutoff table: test.txt lists 7OA5-A but test_cutoffs.csv has no row for it (it lists
# 1BVS-A instead, which is not in test.txt). Every other test chain must be listed, otherwise test_subsets raises.
# Listed chains are counted only in the full-test-set metric ("all") and in no cutoff subset; a warning names them.
test_cutoff_unlisted_chains: [7OA5-A]
metric: fmax            # protein-centric Fmax; pair_aupr and accuracies are reported too

structure:
  mse_to_met: true      # selenomethionine -> MET (SE -> SD); counted per chain

# REQUIRED decision (no default). Options, see downstream/common/missing_atoms.py:
#   {policy: strict}
#   {policy: drop_residue_missing_backbone, incomplete_sidechain: mask}
#   {policy: drop_residue_missing_backbone, incomplete_sidechain: drop_chain_if_fraction_above,
#    max_incomplete_sidechain_fraction: 0.1}
# Chosen policy: drop residues with a missing backbone atom; a residue with an incomplete
# sidechain keeps its backbone and its whole sidechain block is masked like a pretraining MLM block.
missing_atoms:
  policy: drop_residue_missing_backbone
  incomplete_sidechain: mask

max_residues: 1024      # pretraining max_graph_atoms 14336 = 1024 x 14
length_policy: skip     # skip (recorded) | crop_windows (contiguous equal windows, embeddings residue-weighted)
min_residues: 2

qc:
  max_failed_chain_fraction: 0.05     # per split; above it the processed file is not written, exit 1
  max_download_failure_fraction: 0.02

graph:
  sequence_neighbors_k: 3             # stored in the schema; must equal the model config at load time

embedding:
  seed: 0                             # fixes the per-chain random long-range edges
  poolings: [mean_atoms, ca, mean_residues]
  max_atoms_per_batch: 30000

probe:
  pooling: mean_atoms
  seeds: [0, 1, 2]
  epochs: 300
  patience: 30
  batch_size: 256
  lr: 0.001
  weight_decay: 0.0001
  mlp_hidden: 512
  mlp_dropout: 0.2

# Fine-tuning (downstream.finetune, user-run on one GPU): AdamW with an encoder LR below the head LR; a
# random-init encoder trains from scratch with lr_encoder_random_init. patience: null runs every epoch; the
# epoch with the best validation score (valid split only) is evaluated on the test split(s).
finetune:
  pooling: mean_atoms
  head: mlp
  seeds: [0, 1, 2]
  epochs: 50
  patience: null
  max_atoms_per_batch: 15000
  max_samples_per_batch: null
  lr_encoder: 0.00001
  lr_encoder_random_init: 0.0003
  lr_head: 0.001
  weight_decay: 0.0001
  grad_clip_norm: 0.5                # global gradient norm, as in pretraining
  mlp_hidden: 512
  mlp_dropout: 0.2

# Estimated seconds per fine-tune epoch (train + validation) of one job alone on a GPU; ds-run uses it only to
# start the longest fine-tune jobs first. Source: measured in fine-tune run logs (about 15 min per epoch).
finetune_seconds_per_epoch: 900
